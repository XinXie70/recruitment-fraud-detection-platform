services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fake_job_detection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fake_job_detection"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: ${BACKEND_DOCKERFILE:-backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/fake_job_detection
      SECRET_KEY: dev-local-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      CORS_ORIGINS: http://127.0.0.1:5190,http://localhost:5190
      MAX_INPUT_CHARS: "50000"
      MODEL_TIMEOUT_SECONDS: "30"
      MODEL_MAX_WORKERS: "3"
      XAI_USE_SHAP: "true"
      OLLAMA_ENABLED: "false"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ""
      MODEL_SERVER_URL: ${MODEL_SERVER_URL:-}
      MODEL_SERVER_TIMEOUT: ${MODEL_SERVER_TIMEOUT:-120}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5190:5190"
    depends_on:
      - backend

volumes:
  postgres_data:
