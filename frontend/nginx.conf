server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS resolver (127.0.0.11) for dynamic DNS resolution.
    # On Render, fall back to Cloudflare (1.1.1.1) if Docker DNS is unavailable.
    resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any non-file route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend (BACKEND_URL is substituted via envsubst at startup)
    location /api/ {
        # Using a variable forces Nginx to re-resolve DNS per-request, preventing
        # 502 errors caused by stale IP cache when Render rotates backend IPs.
        set $upstream "${BACKEND_URL}";
        proxy_pass $upstream;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;
}
