server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver — Google + Cloudflare, short TTL so Render IP changes are picked up
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    # SPA fallback: serve index.html for any non-file route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend (BACKEND_URL is substituted via envsubst at startup)
    # Using a nginx variable forces per-request DNS resolution, avoiding stale IP caches
    # that cause 502 when the backend restarts or wakes from sleep on Render.
    location /api/ {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;
}
