[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "almond-model-pipelines"
version = "1.0.0"
description = "Inference and evaluation pipelines for the Almond application"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["final_model_pipelines*"]
