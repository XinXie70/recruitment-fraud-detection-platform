[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "almond-model-pipelines"
version = "2.0.0"
description = "Sprint3 LR+BERT FP-gate inference pipelines for the Almond backend"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["final_model_pipelines*"]
