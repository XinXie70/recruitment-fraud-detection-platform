# Optional Docker Compose override for using an Ollama service running on the host.
#
# Prerequisites:
#   1. Install and start Ollama on the host computer.
#   2. Download the configured model, for example: ollama pull qwen3:4b
#
# Start Almond Guard with this override:
#   docker compose -f compose.yaml -f compose.ollama.yaml up --build -d

services:
  backend:
    environment:
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-30}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
