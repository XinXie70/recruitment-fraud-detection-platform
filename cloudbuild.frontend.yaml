steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=frontend/Dockerfile.prod
      - --tag=australia-southeast1-docker.pkg.dev/$PROJECT_ID/almond-app/almond-frontend:latest
      - .
images:
  - australia-southeast1-docker.pkg.dev/$PROJECT_ID/almond-app/almond-frontend:latest
options:
  logging: CLOUD_LOGGING_ONLY
