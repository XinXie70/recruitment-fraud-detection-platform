[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests", "model_service/tests"]
pythonpath = [".", "model_service"]
addopts = "-ra"
markers = [
    "e2e: end-to-end tests that load real model_service weights (slow)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep this gate incremental: these rules catch runtime errors, common bugs, and
# unnecessary comprehensions without introducing a repository-wide formatting diff.
select = ["E9", "F", "B", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
