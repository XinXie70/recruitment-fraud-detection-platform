# ============================================================
# Production Docker Compose — Backend + Frontend + Database
#
# Model inference is delegated to a standalone Model Inference Server.
# Set MODEL_SERVER_URL to connect; leave empty to load models locally (needs 8GB+ RAM).
# When MODEL_SERVER_URL is set, the slim Dockerfile.remote is used (no ML deps).
#
# Usage: docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fake_job_detection}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fake_job_detection}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: ${BACKEND_DOCKERFILE:-backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fake_job_detection}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5190,http://localhost:5190}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-50000}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
      MODEL_MAX_WORKERS: ${MODEL_MAX_WORKERS:-3}
      XAI_USE_SHAP: ${XAI_USE_SHAP:-true}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_SERVER_URL: ${MODEL_SERVER_URL:-}
      MODEL_SERVER_TIMEOUT: ${MODEL_SERVER_TIMEOUT:-120}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
