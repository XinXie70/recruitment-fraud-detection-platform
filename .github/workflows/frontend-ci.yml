name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-remote.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-remote.txt pytest pytest-cov ruff

      - name: Lint backend
        working-directory: backend
        run: ruff check . --select E9,F,B --ignore B008

      - name: Test backend with coverage
        working-directory: backend
        env:
          MODEL_SERVER_URL: http://model-server.invalid
        run: python -m pytest tests -q --cov=. --cov-config=.coveragerc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: End-to-end test
        run: npm run test:e2e

      - name: Build
        run: npm run build
