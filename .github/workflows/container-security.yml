name: Container Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * 1"

permissions:
  contents: read

jobs:
  dockerfile-lint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.2.0
        with:
          recursive: true
          failure-threshold: error

  filesystem-scan:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan dependencies and repository secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Hadolint is the Dockerfile configuration gate. Keep Trivy focused
          # on dependency vulnerabilities and secret detection.
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
