services:
  model-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: model-service:latest
    container_name: model-service
    # Bind to loopback on the host to avoid exposing port 5000 on all interfaces.
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      APP_ENV: "development"
      PORT: "5000"
      HOST: "0.0.0.0"
      ALLOW_CPU: "${ALLOW_CPU:-1}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-180}"
      MODEL_FILES_ROOT: "${MODEL_FILES_ROOT:-/app/model_service/models}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL_CORS_ORIGINS: "${MODEL_CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}"
      RATE_LIMIT_PREDICT: "${RATE_LIMIT_PREDICT:-30/minute}"
      RATE_LIMIT_PREDICT_BATCH: "${RATE_LIMIT_PREDICT_BATCH:-300/minute}"
      MAX_CONTENT_LENGTH: "${MAX_CONTENT_LENGTH:-1048576}"
      MAX_TEXT_CHARS: "${MAX_TEXT_CHARS:-50000}"
      MAX_BATCH_ITEMS: "${MAX_BATCH_ITEMS:-100}"
      MAX_BATCH_TOTAL_CHARS: "${MAX_BATCH_TOTAL_CHARS:-500000}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # BERT on CPU needs headroom; recommend >= 4 GiB for local runs.
    deploy:
      resources:
        limits:
          memory: 4G
