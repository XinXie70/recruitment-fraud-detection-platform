name: almond-portfolio

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fake_job_detection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fake_job_detection"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  model-service:
    image: almond-model-service:portfolio
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: production
      PORT: "5000"
      HOST: "0.0.0.0"
      ALLOW_CPU: "1"
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "4"
      GUNICORN_TIMEOUT: "180"
      MODEL_FILES_ROOT: /app/model_service/models
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY in the deployment environment file}
      MODEL_CORS_ORIGINS: http://backend:8000
      RATE_LIMIT_PREDICT: ${RATE_LIMIT_PREDICT:-30/minute}
      RATE_LIMIT_PREDICT_BATCH: ${RATE_LIMIT_PREDICT_BATCH:-300/minute}
      MAX_CONTENT_LENGTH: "1048576"
      MAX_TEXT_CHARS: "50000"
      MAX_BATCH_ITEMS: "100"
      MAX_BATCH_TOTAL_CHARS: "500000"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  migrate:
    image: almond-backend:portfolio
    build:
      context: .
      dockerfile: backend/Dockerfile.remote
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@database:5432/fake_job_detection
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the deployment environment file}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in the deployment environment file}
      RUN_DATABASE_MIGRATIONS: "true"
    command: ["true"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    image: almond-backend:portfolio
    build:
      context: .
      dockerfile: backend/Dockerfile.remote
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@database:5432/fake_job_detection
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the deployment environment file}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in the deployment environment file}
      MODEL_SERVER_URL: http://model-service:5000
      MODEL_SERVER_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY in the deployment environment file}
      MODEL_SERVER_TIMEOUT: "180"
      RUN_DATABASE_MIGRATIONS: "false"
      TRUST_PROXY_HEADERS: "true"
      LOG_FORMAT: json
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: almond-frontend:portfolio
    build:
      context: .
      dockerfile: frontend/Dockerfile.single-host
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  gateway:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in the deployment environment file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
